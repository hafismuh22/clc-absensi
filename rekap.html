<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Daftar Hadir - CLC PERMODALAN TKB MORISEM 3</title>


<style>

/* ==================================================
   DASAR
================================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f1f5f9;

  color: #0f172a;

}


/* ==================================================
   HEADER
================================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #0f172a,
      #1e3a8a
    );

  color: white;

  padding: 18px 15px;

  text-align: center;

}


.header h1 {

  margin: 0;

  font-size: 22px;

  font-weight: 900;

}


.header p {

  margin: 4px 0;

  font-size: 12px;

  font-weight: 700;

}


.header .tahun-ajaran {

  margin-top: 2px;

  font-size: 11px;

  font-weight: 700;

}


/* ==================================================
   CONTAINER
================================================== */

.container {

  width: 100%;

  max-width: 1400px;

  margin: auto;

  padding: 18px 14px 40px;

}


/* ==================================================
   FILTER
================================================== */

.filter-card {

  background: white;

  padding: 16px;

  border-radius: 15px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.07);

  margin-bottom: 15px;

}


.filters {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

}


.filter-group label {

  display: block;

  font-size: 11px;

  font-weight: 800;

  color: #475569;

  margin-bottom: 5px;

}


select {

  width: 100%;

  padding: 10px;

  border: 1px solid #cbd5e1;

  border-radius: 9px;

  background: white;

  font-size: 13px;

}


button {

  width: 100%;

  padding: 10px;

  border: none;

  border-radius: 9px;

  background: #2563eb;

  color: white;

  font-size: 13px;

  font-weight: 800;

  cursor: pointer;

}


button:hover {

  opacity: .9;

}


/* ==================================================
   JUDUL REKAP
================================================== */

.table-card {

  background: white;

  border-radius: 15px;

  padding: 15px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.07);

}


.print-header {

  text-align: center;

  margin-bottom: 12px;

}


.print-header .judul {

  font-size: 16px;

  font-weight: 900;

  margin-bottom: 3px;

}


.print-header .sekolah {

  font-size: 12px;

  font-weight: 800;

  margin-bottom: 2px;

}


.print-header .tahun {

  font-size: 11px;

  font-weight: 700;

  margin-bottom: 8px;

}


.info-rekap {

  text-align: left;

  font-size: 11px;

  font-weight: 800;

  margin-bottom: 8px;

  padding-bottom: 6px;

  border-bottom: 1px solid #cbd5e1;

}


.separator {

  margin: 0 7px;

  color: #64748b;

}


/* ==================================================
   TABLE
================================================== */

.table-wrapper {

  width: 100%;

  overflow-x: auto;

}


table {

  border-collapse: collapse;

  width: 100%;

  min-width: 950px;

}


th {

  background: #0f172a;

  color: white;

  border: 1px solid #334155;

  padding: 5px 4px;

  font-size: 9px;

  text-align: center;

}


td {

  border: 1px solid #cbd5e1;

  padding: 5px 4px;

  font-size: 9px;

  text-align: center;

}


td.nama {

  text-align: left;

  min-width: 170px;

  font-weight: 700;

}


td.id {

  font-weight: 700;

  white-space: nowrap;

}


.hadir {

  background: #dcfce7;

  color: #166534;

  font-weight: 900;

}


.tidak {

  color: #94a3b8;

}


.jumlah-hadir {

  font-weight: 900;

}


.persen {

  font-weight: 900;

  white-space: nowrap;

}


/* ==================================================
   LOADING
================================================== */

.loading {

  text-align: center;

  padding: 30px;

  color: #64748b;

  font-size: 13px;

}


.empty {

  text-align: center;

  padding: 35px;

  color: #64748b;

  font-size: 13px;

}


/* ==================================================
   TOMBOL CETAK
================================================== */

.print-area {

  margin-top: 15px;

  text-align: right;

}


.print-button {

  width: auto;

  padding: 10px 18px;

  background: #16a34a;

}


/* ==================================================
   MOBILE
================================================== */

@media (
  max-width: 700px
) {

  .filters {

    grid-template-columns: 1fr;

  }


  .header h1 {

    font-size: 20px;

  }


  .header p {

    font-size: 11px;

  }


  .table-card {

    padding: 10px;

  }


  .print-header .judul {

    font-size: 14px;

  }


  .print-header .sekolah {

    font-size: 11px;

  }

}


/* ==================================================
   CETAK
================================================== */

@media print {


  @page {

    size: landscape;

    margin: 8mm;

  }


  body {

    background: white;

  }


  .header {

    background: white;

    color: black;

    padding: 0 0 5px;

  }


  .header h1 {

    display: none;

  }


  .header p {

    display: none;

  }


  .container {

    max-width: none;

    padding: 0;

  }


  .filter-card {

    display: none;

  }


  .table-card {

    box-shadow: none;

    border-radius: 0;

    padding: 0;

  }


  .print-header {

    display: block;

    margin-bottom: 8px;

  }


  .print-header .judul {

    font-size: 15px;

  }


  .print-header .sekolah {

    font-size: 11px;

  }


  .print-header .tahun {

    font-size: 10px;

  }


  .info-rekap {

    font-size: 9px;

    margin-bottom: 5px;

    padding-bottom: 4px;

  }


  .table-wrapper {

    overflow: visible;

  }


  table {

    width: 100%;

    min-width: 0;

  }


  th {

    font-size: 7px;

    padding: 3px 2px;

  }


  td {

    font-size: 7px;

    padding: 3px 2px;

  }


  td.nama {

    min-width: 0;

    width: 160px;

  }


  .print-area {

    display: none;

  }

}

</style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<div class="header">

  <h1>
    DAFTAR HADIR
  </h1>

  <p>
    CLC PERMODALAN TKB MORISEM 3
  </p>

  <p class="tahun-ajaran">
    TAHUN AJARAN
    <span id="tahunAjaranHeader">
      2026-2027
    </span>
  </p>

</div>



<div class="container">


<!-- ==================================================
     FILTER
================================================== -->

<div class="filter-card">


  <div class="filters">


    <!-- BULAN -->

    <div class="filter-group">

      <label>
        BULAN
      </label>

      <select id="bulan">

        <option value="1">
          Januari
        </option>

        <option value="2">
          Februari
        </option>

        <option value="3">
          Maret
        </option>

        <option value="4">
          April
        </option>

        <option value="5">
          Mei
        </option>

        <option value="6">
          Juni
        </option>

        <option value="7">
          Juli
        </option>

        <option value="8">
          Agustus
        </option>

        <option value="9">
          September
        </option>

        <option value="10">
          Oktober
        </option>

        <option value="11">
          November
        </option>

        <option value="12">
          Desember
        </option>

      </select>

    </div>


    <!-- TAHUN -->

    <div class="filter-group">

      <label>
        TAHUN
      </label>

      <select id="tahun"></select>

    </div>


    <!-- KELAS -->

    <div class="filter-group">

      <label>
        KELAS
      </label>

      <select id="kelas">

        <option value="SEMUA">
          Semua Kelas
        </option>

      </select>

    </div>


    <!-- TAMPILKAN -->

    <div class="filter-group">

      <label>
        AKSI
      </label>

      <button
        onclick="loadRekap()"
      >

        🔍 TAMPILKAN

      </button>

    </div>


  </div>

</div>



<!-- ==================================================
     REKAP
================================================== -->

<div class="table-card">


  <!-- HEADER CETAK -->

  <div class="print-header">

    <div class="judul">
      DAFTAR HADIR
    </div>

    <div class="sekolah">
      CLC PERMODALAN TKB MORISEM 3
    </div>

    <div class="tahun">
      TAHUN AJARAN
      <span id="tahunAjaran">
        2026-2027
      </span>
    </div>

    <div
      id="infoRekap"
      class="info-rekap"
    >

      KELAS : -
      <span class="separator">|</span>
      SEMESTER : -
      <span class="separator">|</span>
      BULAN : -

    </div>

  </div>



  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
    style="display:none;"
  >

    ⏳ Memuat data rekap...

  </div>



  <!-- TABLE -->

  <div
    id="tableContainer"
    class="table-wrapper"
  ></div>



  <!-- PRINT -->

  <div class="print-area">

    <button
      class="print-button"
      onclick="window.print()"
    >

      🖨️ CETAK REKAP

    </button>

  </div>


</div>


</div>



<script>


/****************************************************
 * URL APPS SCRIPT
 ****************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwBGvZdnWIfwNjpevh9WLSPtfD5ho_TqOYm9z2xFwE5SdKP_egi1INIkRevY3yFLNxi/exec";


/****************************************************
 * NAMA BULAN
 ****************************************************/

const namaBulan = [

  "",

  "Januari",

  "Februari",

  "Maret",

  "April",

  "Mei",

  "Juni",

  "Juli",

  "Agustus",

  "September",

  "Oktober",

  "November",

  "Desember"

];


/****************************************************
 * BUAT PILIHAN TAHUN
 ****************************************************/

function buatTahun() {

  const select =
    document.getElementById(
      "tahun"
    );


  const tahunSekarang =
    new Date().getFullYear();


  for (
    let tahun =
      tahunSekarang - 2;

    tahun <=
      tahunSekarang + 2;

    tahun++
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      tahun;


    option.textContent =
      tahun;


    if (
      tahun ===
      tahunSekarang
    ) {

      option.selected =
        true;

    }


    select.appendChild(
      option
    );

  }

}


/****************************************************
 * AMBIL DAFTAR KELAS
 ****************************************************/

function loadKelas() {


  const callbackName =
    "kelasCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let selesai =
    false;


  window[callbackName] =
    function(data) {

      selesai =
        true;


      script.remove();


      try {

        delete window[
          callbackName
        ];

      }

      catch(e) {}


      if (
        !Array.isArray(data)
      ) {

        return;

      }


      const select =
        document.getElementById(
          "kelas"
        );


      const daftarKelas =
        [];


      data.forEach(
        function(item) {

          const kelas =
            String(
              item.kelas || ""
            ).trim();


          if (
            kelas &&
            !daftarKelas.includes(
              kelas
            )
          ) {

            daftarKelas.push(
              kelas
            );

          }

        }
      );


      daftarKelas.sort(
        function(a,b) {

          return a.localeCompare(
            b,
            undefined,
            {
              numeric: true
            }
          );

        }
      );


      daftarKelas.forEach(
        function(kelas) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            kelas;


          option.textContent =
            "Kelas " +
            kelas;


          select.appendChild(
            option
          );

        }
      );

    };


  script.src =
    API_URL +
    "?action=siswa" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      if (selesai) {
        return;
      }


      selesai =
        true;


      script.remove();


      try {

        delete window[
          callbackName
        ];

      }

      catch(e) {}

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * LOAD REKAP
 ****************************************************/

function loadRekap() {


  const bulan =
    document.getElementById(
      "bulan"
    ).value;


  const tahun =
    document.getElementById(
      "tahun"
    ).value;


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  document
    .getElementById(
      "loading"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "tableContainer"
    )
    .innerHTML =
    "";


  const callbackName =
    "rekapCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let selesai =
    false;


  window[callbackName] =
    function(data) {

      selesai =
        true;


      clearTimeout(
        timeout
      );


      script.remove();


      try {

        delete window[
          callbackName
        ];

      }

      catch(e) {}


      document
        .getElementById(
          "loading"
        )
        .style.display =
        "none";


      tampilkanRekap(
        data
      );

    };


  const timeout =
    setTimeout(
      function() {

        if (selesai) {
          return;
        }


        selesai =
          true;


        script.remove();


        try {

          delete window[
            callbackName
          ];

        }

        catch(e) {}


        document
          .getElementById(
            "loading"
          )
          .style.display =
          "none";


        document
          .getElementById(
            "tableContainer"
          )
          .innerHTML = `

            <div class="empty">

              ❌ Server tidak dapat
              dihubungi.

            </div>

          `;

      },
      15000
    );


  const url =
    API_URL +

    "?action=rekap" +

    "&bulan=" +
    encodeURIComponent(
      bulan
    ) +

    "&tahun=" +
    encodeURIComponent(
      tahun
    ) +

    "&kelas=" +
    encodeURIComponent(
      kelas
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {

      clearTimeout(
        timeout
      );


      if (selesai) {
        return;
      }


      selesai =
        true;


      script.remove();


      try {

        delete window[
          callbackName
        ];

      }

      catch(e) {}


      document
        .getElementById(
          "loading"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "tableContainer"
        )
        .innerHTML = `

          <div class="empty">

            ❌ Gagal mengambil data.

          </div>

        `;

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * TAMPILKAN REKAP
 ****************************************************/

function tampilkanRekap(
  data
) {


  if (
    !data ||
    data.success !== true
  ) {

    document
      .getElementById(
        "tableContainer"
      )
      .innerHTML = `

        <div class="empty">

          ❌ Data rekap tidak tersedia.

        </div>

      `;

    return;

  }


  /************************************************
   * SEMESTER
   ************************************************/

  const semester =

    (
      data.bulan >= 7 &&
      data.bulan <= 12
    )

      ?

    "GANJIL"

      :

    "GENAP";


  /************************************************
   * TAHUN AJARAN
   ************************************************/

  let tahunAwal;


  if (
    data.bulan >= 7
  ) {

    tahunAwal =
      data.tahun;

  }

  else {

    tahunAwal =
      data.tahun - 1;

  }


  const tahunAjaran =

    tahunAwal +
    "-" +
    (
      tahunAwal + 1
    );


  /************************************************
   * KELAS
   ************************************************/

  const kelasText =

    data.kelas === "SEMUA"

      ?

    "SEMUA"

      :

    data.kelas;


  /************************************************
   * TAHUN AJARAN
   ************************************************/

  document
    .getElementById(
      "tahunAjaran"
    )
    .textContent =
    tahunAjaran;


  document
    .getElementById(
      "tahunAjaranHeader"
    )
    .textContent =
    tahunAjaran;


  /************************************************
   * INFO REKAP
   ************************************************/

  document
    .getElementById(
      "infoRekap"
    )
    .innerHTML =

    "KELAS : " +
    escapeHtml(
      kelasText
    ) +

    " <span class='separator'>|</span> " +

    "SEMESTER : " +
    semester +

    " <span class='separator'>|</span> " +

    "BULAN : " +
    namaBulan[
      data.bulan
    ].toUpperCase();


  /************************************************
   * JIKA KOSONG
   ************************************************/

  if (
    !data.siswa ||
    data.siswa.length === 0
  ) {

    document
      .getElementById(
        "tableContainer"
      )
      .innerHTML = `

        <div class="empty">

          📭 Tidak ada data siswa
          untuk kelas tersebut.

        </div>

      `;

    return;

  }


  /************************************************
   * BUAT TABLE
   ************************************************/

  let html = `

    <table>

      <thead>

        <tr>

          <th rowspan="2">
            NO
          </th>

          <th rowspan="2">
            ID
          </th>

          <th rowspan="2">
            NAMA SISWA
          </th>

          <th rowspan="2">
            KELAS
          </th>

          <th colspan="${data.jumlahHari}">
            TANGGAL
          </th>

          <th rowspan="2">
            HADIR
          </th>

          <th rowspan="2">
            %
          </th>

        </tr>

        <tr>

  `;


  /************************************************
   * NOMOR TANGGAL
   ************************************************/

  for (
    let hari = 1;

    hari <=
    data.jumlahHari;

    hari++
  ) {

    html += `

      <th>
        ${hari}
      </th>

    `;

  }


  html += `

        </tr>

      </thead>

      <tbody>

  `;


  /************************************************
   * DATA SISWA
   ************************************************/

  data.siswa.forEach(
    function(item, index) {


      html += `

        <tr>

          <td>
            ${index + 1}
          </td>

          <td class="id">
            ${escapeHtml(
              item.id
            )}
          </td>

          <td class="nama">
            ${escapeHtml(
              item.nama
            )}
          </td>

          <td>
            ${escapeHtml(
              item.kelas
            )}
          </td>

      `;


      /************************************************
       * SETIAP TANGGAL
       ************************************************/

      for (
        let hari = 1;

        hari <=
        data.jumlahHari;

        hari++
      ) {


        const dataHari =
          item.hari[
            hari
          ];


        if (
          dataHari &&
          dataHari.status ===
          "HADIR"
        ) {

          html += `

            <td
              class="hadir"
              title="Hadir pukul ${escapeHtml(
                dataHari.jam
              )}"
            >

              ✓

            </td>

          `;

        }

        else {

          html += `

            <td class="tidak">
              -
            </td>

          `;

        }

      }


      /************************************************
       * TOTAL HADIR
       ************************************************/

      html += `

          <td class="jumlah-hadir">

            ${item.hadir}

          </td>


          <td class="persen">

            ${item.persen}%

          </td>


        </tr>

      `;

    }
  );


  html += `

      </tbody>

    </table>

  `;


  document
    .getElementById(
      "tableContainer"
    )
    .innerHTML =
    html;

}


/****************************************************
 * ESCAPE HTML
 ****************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/****************************************************
 * MULAI
 ****************************************************/

buatTahun();

loadKelas();

loadRekap();

</script>


</body>

</html>
