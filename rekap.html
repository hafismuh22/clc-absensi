<title>

</title>


<style>

/* ==================================================
   DASAR
================================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f1f5f9;

  color: #0f172a;

}


/* ==================================================
   HEADER
================================================== */

.header {

  background:
    linear-gradient(
      135deg,
      #0f172a,
      #1e3a8a
    );

  color: white;

  padding: 18px 15px;

  text-align: center;

}


.header h1 {

  margin: 0;

  font-size: 22px;

  font-weight: 900;

}


.header p {

  margin: 4px 0;

  font-size: 12px;

  font-weight: 700;

}


.header .tahun-ajaran {

  font-size: 11px;

}


/* ==================================================
   CONTAINER
================================================== */

.container {

  width: 100%;

  max-width: 1400px;

  margin: auto;

  padding: 18px 14px 40px;

}


/* ==================================================
   FILTER
================================================== */

.filter-card {

  background: white;

  padding: 16px;

  border-radius: 15px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.07);

  margin-bottom: 15px;

}


.filters {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 10px;

}


.filter-group label {

  display: block;

  font-size: 11px;

  font-weight: 800;

  color: #475569;

  margin-bottom: 5px;

}


select {

  width: 100%;

  padding: 10px;

  border:
    1px solid
    #cbd5e1;

  border-radius: 9px;

  background: white;

  font-size: 13px;

}


button {

  width: 100%;

  padding: 10px;

  border: none;

  border-radius: 9px;

  background: #2563eb;

  color: white;

  font-size: 13px;

  font-weight: 800;

  cursor: pointer;

}


/* ==================================================
   HEADER CETAK
================================================== */

.table-card {

  background: white;

  border-radius: 15px;

  padding: 15px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,.07);

}


.print-header {

  text-align: center;

  margin-bottom: 12px;

}


.print-header .judul {

  font-size: 16px;

  font-weight: 900;

  margin-bottom: 3px;

}


.print-header .sekolah {

  font-size: 12px;

  font-weight: 800;

  margin-bottom: 2px;

}


.print-header .tahun {

  font-size: 11px;

  font-weight: 700;

  margin-bottom: 8px;

}


.info-rekap {

  text-align: left;

  font-size: 11px;

  font-weight: 800;

  margin-bottom: 8px;

  padding-bottom: 6px;

  border-bottom:
    1px solid
    #cbd5e1;

}


.separator {

  margin: 0 7px;

  color: #64748b;

}


/* ==================================================
   TABLE
================================================== */

.table-wrapper {

  width: 100%;

  overflow-x: auto;

}


table {

  border-collapse: collapse;

  width: 100%;

  min-width: 950px;

}


th {

  background: #0f172a;

  color: white;

  border:
    1px solid
    #334155;

  padding: 5px 4px;

  font-size: 9px;

  text-align: center;

}


td {

  border:
    1px solid
    #cbd5e1;

  padding: 5px 4px;

  font-size: 9px;

  text-align: center;

}


td.nama {

  text-align: left;

  min-width: 170px;

  font-weight: 700;

}


td.id {

  font-weight: 700;

  white-space: nowrap;

}


/* ==================================================
   STATUS
================================================== */

.status-hadir {

  background: #dcfce7;

  color: #166534;

  font-weight: 900;

}


.status-sakit {

  background: #fef3c7;

  color: #92400e;

  font-weight: 900;

}


.status-izin {

  background: #dbeafe;

  color: #1e40af;

  font-weight: 900;

}


.status-alpa {

  background: #fee2e2;

  color: #991b1b;

  font-weight: 900;

}


.status-kosong {

  color: #94a3b8;

}


/* ==================================================
   JUMLAH
================================================== */

.jumlah-hadir {

  font-weight: 900;

}


.persen {

  font-weight: 900;

  white-space: nowrap;

}


/* ==================================================
   KETERANGAN
================================================== */

.keterangan {

  margin-top: 10px;

  font-size: 10px;

  font-weight: 700;

  color: #475569;

}


.keterangan span {

  margin-right: 12px;

}


.loading {

  text-align: center;

  padding: 30px;

  color: #64748b;

}


.empty {

  text-align: center;

  padding: 35px;

  color: #64748b;

}


/* ==================================================
   CETAK
================================================== */

.print-area {

  margin-top: 15px;

  text-align: right;

}


.print-button {

  width: auto;

  padding:
    10px 18px;

  background:
    #16a34a;

}


/* ==================================================
   MOBILE
================================================== */

@media (
  max-width: 700px
) {

  .filters {

    grid-template-columns:
      1fr;

  }


  .header h1 {

    font-size: 20px;

  }


  .table-card {

    padding: 10px;

  }

}


/* ==================================================
   PRINT A4 LANDSCAPE - FULL KERTAS
================================================== */

  @page {
    size: A4 landscape;
    margin: 5mm;
  }

  html,
  body {
    width: 100%;
    min-width: 0;
    margin: 0;
    padding: 0;
    background: white !important;
  }

  body {

  }

  .header,
  .filter-card,

    display: none !important;
  }

    width: 100% !important;

  }

    border-radius: 0 !important;
    box-shadow: none !important;
    background: white !important;
  }

  .print-header {

    margin: 0 0 4mm 0 !important;
    padding: 0 !important;

  }

  .print-header .judul {
    font-size: 15pt !important;

    margin-bottom: 1mm !important;
  }

  .print-header .sekolah {
    font-size: 10pt !important;

    margin-bottom: 1mm !important;
  }

  .print-header .tahun {
    font-size: 9pt !important;
    line-height: 1.1 !important;
    margin-bottom: 3mm !important;
  }

  .info-rekap {
    width: 100% !important;
    margin: 0 0 2mm 0 !important;
    padding: 1.5mm 0 !important;
    border-top: 1px solid #000 !important;
    border-bottom: 1px solid #000 !important;
    font-size: 8pt !important;
    line-height: 1.1 !important;
  }

  .table-wrapper {
    width: 100% !important;
    overflow: visible !important;
  }

  table {
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100% !important;
    table-layout: fixed !important;
    border-collapse: collapse !important;
  }

  th,

    border: 1px solid #000 !important;
    padding: 1.2mm 0.7mm !important;
    font-size: 7pt !important;
    line-height: 1.05 !important;
    text-align: center !important;
    vertical-align: middle !important;
    overflow: hidden !important;
  }

  th {

    font-weight: 900 !important;
  }

  td.nama {
    width: 32mm !important;
    min-width: 32mm !important;
    text-align: left !important;

    word-break: break-word !important;

  }

  td.id {
    white-space: nowrap !important;
  }

  .status-hadir {
    background: #dcfce7 !important;
    color: #166534 !important;
    font-weight: 900 !important;
  }

  .status-sakit {
    background: #fef3c7 !important;
    color: #92400e !important;
    font-weight: 900 !important;
  }

  .status-izin {
    background: #dbeafe !important;
    color: #1e40af !important;
    font-weight: 900 !important;
  }

  .status-alpa {
    background: #fee2e2 !important;
    color: #991b1b !important;
    font-weight: 900 !important;
  }

  .status-kosong {
    color: #64748b !important;
  }

  .keterangan {
    display: block !important;
    width: 100% !important;
    margin-top: 2mm !important;
    font-size: 7pt !important;
    color: #000 !important;
  }

  /* Paksa isi tetap satu halaman bila memungkinkan */
  .table-wrapper,
  table {
    page-break-inside: auto;
  }

  thead {
    display: table-header-group;
  }

  tr {
    page-break-inside: avoid;
  }
}</style>

  <p class="tahun-ajaran">

<div class="container">


<!-- ==================================================

<div class="filter-card">

<script>


/****************************************************
 * URL APPS SCRIPT
 ****************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwBGvZdnWIfwNjpevh9WLSPtfD5ho_TqOYm9z2xFwE5SdKP_egi1INIkRevY3yFLNxi/exec";


/****************************************************
 * BULAN
 ****************************************************/

const namaBulan = [

  "",

  "Januari",

  "Februari",

  "Maret",

  "April",

  "Mei",

  "Juni",

  "Juli",

  "Agustus",

  "September",

  "Oktober",

  "November",

  "Desember"

];


/****************************************************
 * TAHUN
 ****************************************************/

function buatTahun() {


  const select =
    document.getElementById(
      "tahun"
    );


  const sekarang =
    new Date();


  const tahunSekarang =
    sekarang.getFullYear();


  for (
    let tahun =
      tahunSekarang - 2;

    tahun <=
      tahunSekarang + 2;

    tahun++
  ) {


    const option =
      document.createElement(
        "option"
      );


    option.value =
      tahun;


    option.textContent =
      tahun;


    if (
      tahun ===
      tahunSekarang
    ) {

      option.selected =
        true;

    }


    select.appendChild(
      option
    );

  }

}


/****************************************************
 * LOAD KELAS
 ****************************************************/

function loadKelas() {


  const callbackName =
    "kelasCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(data) {


      script.remove();


      try {

        delete window[
          callbackName
        ];

      }

      catch(e) {}


      if (
        !Array.isArray(data)
      ) {

        return;

      }


      const select =
        document.getElementById(
          "kelas"
        );


      const daftarKelas =
        [];


      data.forEach(
        function(item) {


          const kelas =
            String(
              item.kelas || ""
            ).trim();


          if (
            kelas &&
            !daftarKelas.includes(
              kelas
            )
          ) {

            daftarKelas.push(
              kelas
            );

          }

        }
      );


      daftarKelas.sort(
        function(a,b) {

          return a.localeCompare(
            b,
            undefined,
            {
              numeric: true
            }
          );

        }
      );


      daftarKelas.forEach(
        function(kelas) {


          const option =
            document.createElement(
              "option"
            );


          option.value =
            kelas;


          option.textContent =
            "Kelas " +
            kelas;


          select.appendChild(
            option
          );

        }
      );

    };


  script.src =
    API_URL +

    "?action=siswa" +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  document.body.appendChild(
    script
  );

}


/****************************************************
 * LOAD REKAP
 ****************************************************/

function loadRekap() {


  const bulan =
    document.getElementById(
      "bulan"
    ).value;


  const tahun =
    document.getElementById(
      "tahun"
    ).value;


  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  document
    .getElementById(
      "loading"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "tableContainer"
    )
    .innerHTML =
    "";


  document
    .getElementById(
      "keterangan"
    )
    .style.display =
    "none";


  const callbackName =
    "rekapCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let selesai =
    false;


  window[callbackName] =
    function(data) {


      selesai =
        true;


      clearTimeout(
        timeout
      );


      script.remove();


      try {

        delete window[
          callbackName
        ];

      }

      catch(e) {}


      document
        .getElementById(
          "loading"
        )
        .style.display =
        "none";


      tampilkanRekap(
        data
      );

    };


  const timeout =
    setTimeout(
      function() {


        if (selesai) {
          return;
        }


        selesai =
          true;


        script.remove();


        try {

          delete window[
            callbackName
          ];

        }

        catch(e) {}


        document
          .getElementById(
            "loading"
          )
          .style.display =
          "none";


        document
          .getElementById(
            "tableContainer"
          )
          .innerHTML = `

            <div class="empty">

              ❌ Server tidak dapat
              dihubungi.

            </div>

          `;

      },
      15000
    );


  const url =

    API_URL +

    "?action=rekap" +

    "&bulan=" +
    encodeURIComponent(
      bulan
    ) +

    "&tahun=" +
    encodeURIComponent(
      tahun
    ) +

    "&kelas=" +
    encodeURIComponent(
      kelas
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.src =
    url;


  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      if (selesai) {
        return;
      }


      selesai =
        true;


      script.remove();


      document
        .getElementById(
          "loading"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "tableContainer"
        )
        .innerHTML = `

          <div class="empty">

            ❌ Gagal mengambil data.

          </div>

        `;

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * TAMPILKAN REKAP
 ****************************************************/

function tampilkanRekap(
  data
) {


  if (
    !data ||
    data.success !== true
  ) {


    document
      .getElementById(
        "tableContainer"
      )
      .innerHTML = `

        <div class="empty">

          ❌ Data rekap tidak tersedia.

        </div>

      `;


    return;

  }


  /************************************************
   * SEMESTER
   ************************************************/

  const semester =

    (
      data.bulan >= 7 &&
      data.bulan <= 12
    )

      ?

    "GANJIL"

      :

    "GENAP";


  /************************************************
   * TAHUN AJARAN
   ************************************************/

  let tahunAwal;


  if (
    data.bulan >= 7
  ) {

    tahunAwal =
      data.tahun;

  }

  else {

    tahunAwal =
      data.tahun - 1;

  }


  const tahunAjaran =

    tahunAwal +
    "-" +
    (
      tahunAwal + 1
    );


  /************************************************
   * KELAS
   ************************************************/

  const kelasText =

    data.kelas ===
    "SEMUA"

      ?

    "SEMUA"

      :

    data.kelas;


  /************************************************
   * TAHUN AJARAN
   ************************************************/

  document
    .getElementById(
      "tahunAjaran"
    )
    .textContent =
    tahunAjaran;


  document
    .getElementById(
      "tahunAjaranHeader"
    )
    .textContent =
    tahunAjaran;


  /************************************************
   * INFO REKAP
   ************************************************/

  document
    .getElementById(
      "infoRekap"
    )
    .innerHTML =

    "KELAS : " +

    escapeHtml(
      kelasText
    ) +

    " <span class='separator'>|</span> " +

    "SEMESTER : " +

    semester +

    " <span class='separator'>|</span> " +

    "BULAN : " +

    namaBulan[
      data.bulan
    ].toUpperCase();


  /************************************************
   * KETERANGAN
   ************************************************/

  document
    .getElementById(
      "keterangan"
    )
    .style.display =
    "block";


  /************************************************
   * JIKA TIDAK ADA SISWA
   ************************************************/

  if (
    !data.siswa ||
    data.siswa.length === 0
  ) {


    document
      .getElementById(
        "tableContainer"
      )
      .innerHTML = `

        <div class="empty">

          📭 Tidak ada data siswa
          untuk kelas tersebut.

        </div>

      `;


    return;

  }


  /************************************************
   * TABLE HEADER
   ************************************************/

  let html = `

    <table>

      <thead>

        <tr>

          <th rowspan="2">
            NO
          </th>

          <th rowspan="2">
            ID
          </th>

          <th rowspan="2">
            NAMA SISWA
          </th>

          <th rowspan="2">
            KELAS
          </th>

          <th colspan="${data.jumlahHari}">
            TANGGAL
          </th>

          <th rowspan="2">
            HADIR
          </th>

          <th rowspan="2">
            %
          </th>

        </tr>

        <tr>

  `;


  /************************************************
   * NOMOR TANGGAL
   ************************************************/

  for (
    let hari = 1;

    hari <=
    data.jumlahHari;

    hari++
  ) {


    html += `

      <th>
        ${hari}
      </th>

    `;

  }


  html += `

        </tr>

      </thead>

      <tbody>

  `;


  /************************************************
   * DATA SISWA
   ************************************************/

  data.siswa.forEach(
    function(item, index) {


      html += `

        <tr>

          <td>
            ${index + 1}
          </td>

          <td class="id">

            ${escapeHtml(
              item.id
            )}

          </td>

          <td class="nama">

            ${escapeHtml(
              item.nama
            )}

          </td>

          <td>

            ${escapeHtml(
              item.kelas
            )}

          </td>

      `;


      /************************************************
       * STATUS SETIAP TANGGAL
       ************************************************/

      for (
        let hari = 1;

        hari <=
        data.jumlahHari;

        hari++
      ) {


        const dataHari =
          item.hari[
            hari
          ];


        const status =

          dataHari &&
          dataHari.status

            ?

          String(
            dataHari.status
          )
          .trim()
          .toUpperCase()

            :

          "-";


        /********************************************
         * HADIR
         ********************************************/

        if (
          status ===
          "HADIR"
        ) {


          html += `

            <td
              class="status-hadir"
              title="Hadir ${
                escapeHtml(
                  dataHari.jam || ""
                )
              }"
            >

              H

            </td>

          `;

        }


        /********************************************
         * SAKIT
         ********************************************/

        else if (
          status ===
          "SAKIT"
        ) {


          html += `

            <td
              class="status-sakit"
            >

              S

            </td>

          `;

        }


        /********************************************
         * IZIN
         ********************************************/

        else if (
          status ===
          "IZIN"
        ) {


          html += `

            <td
              class="status-izin"
            >

              I

            </td>

          `;

        }


        /********************************************
         * ALPA
         ********************************************/

        else if (
          status ===
          "ALPA"
        ) {


          html += `

            <td
              class="status-alpa"
            >

              A

            </td>

          `;

        }


        /********************************************
         * BELUM ADA DATA
         ********************************************/

        else {


          html += `

            <td
              class="status-kosong"
            >

              -

            </td>

          `;

        }

      }


      /************************************************
       * TOTAL HADIR
       ************************************************/

      html += `

          <td class="jumlah-hadir">

            ${item.hadir}

          </td>


          <td class="persen">

            ${item.persen}%

          </td>


        </tr>

      `;

    }
  );


  html += `

      </tbody>

    </table>

  `;


  document
    .getElementById(
      "tableContainer"
    )
    .innerHTML =
    html;

}


/****************************************************
 * ESCAPE HTML
 ****************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

loadKelas();

loadRekap();
