<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <script src="auth.js"></script>
  <title>Absensi QR - CLC PERMODALAN</title>

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    .header {
      background: linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a
      );

      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: .85;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 18px 14px 30px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow:
        0 8px 25px rgba(0,0,0,.08);
      margin-bottom: 15px;
    }

    .scanner-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 15px;
    }

    .camera-box {
      margin-top: 14px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: white;
      font-size: 14px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 13px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-start {
      background: #2563eb;
      color: white;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    .status {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      margin-top: 12px;
      min-height: 20px;
    }

    /* HASIL */

    #result {
      display: none;
      border-radius: 16px;
      padding: 20px;
      margin-top: 15px;
      text-align: center;
    }

    .success {
      background: #dcfce7;
      border: 2px solid #22c55e;
    }

    .already {
      background: #fef3c7;
      border: 2px solid #f59e0b;
    }

    .invalid {
      background: #fee2e2;
      border: 2px solid #ef4444;
    }

    .error {
      background: #fee2e2;
      border: 2px solid #ef4444;
    }

    .result-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .result-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .student-name {
      font-size: 21px;
      font-weight: 900;
      margin: 8px 0;
    }

    .student-info {
      font-size: 14px;
      line-height: 1.8;
    }

    .status-hadir {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 15px;
      border-radius: 20px;
      background: #16a34a;
      color: white;
      font-weight: 800;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 18px;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: 700;
      color: #2563eb;
    }

    @media (min-width: 700px) {

      .container {
        max-width: 600px;
        padding-top: 25px;
      }

      .header h1 {
        font-size: 28px;
      }

    }

  </style>
</head>


<body>

  <div class="header">

    <h1>ABSENSI QR</h1>

    <p>CLC PERMODALAN</p>

  </div>


  <div class="container">


    <div class="card">

      <div class="scanner-title">
        📷 SCAN QR SISWA
      </div>


      <div id="reader"></div>


      <div class="camera-box">

        <select id="cameraSelect">

          <option value="">
            Memilih kamera...
          </option>

        </select>


        <button
          class="button btn-start"
          onclick="startScanner()"
        >
          📷 MULAI SCAN
        </button>


        <button
          class="button btn-stop"
          onclick="stopScanner()"
        >
          ⛔ HENTIKAN KAMERA
        </button>

      </div>


      <div
        id="scannerStatus"
        class="status"
      >
        Menyiapkan kamera...
      </div>


      <div
        id="loading"
        class="loading"
      >
        ⏳ Memproses absensi...
      </div>


      <div id="result"></div>

    </div>


    <div class="footer">

      Sistem Absensi QR<br>
      CLC PERMODALAN

    </div>

  </div>



<script>


/****************************************************
 * URL APPS SCRIPT
 ****************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwBGvZdnWIfwNjpevh9WLSPtfD5ho_TqOYm9z2xFwE5SdKP_egi1INIkRevY3yFLNxi/exec";


/****************************************************
 * VARIABEL SCANNER
 ****************************************************/

let html5QrCode = null;

let currentCameraId = null;

let scannerRunning = false;

let processingScan = false;


/****************************************************
 * ELEMENT
 ****************************************************/

const cameraSelect =
  document.getElementById(
    "cameraSelect"
  );

const scannerStatus =
  document.getElementById(
    "scannerStatus"
  );

const resultBox =
  document.getElementById(
    "result"
  );

const loading =
  document.getElementById(
    "loading"
  );


/****************************************************
 * TAMPILKAN STATUS
 ****************************************************/

function setScannerStatus(text) {

  scannerStatus.textContent = text;

}


/****************************************************
 * MINTA IZIN KAMERA
 ****************************************************/

async function requestCameraPermission() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });


    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    return true;

  }

  catch (error) {

    console.error(error);

    setScannerStatus(
      "❌ Izin kamera ditolak."
    );

    return false;

  }

}


/****************************************************
 * LOAD KAMERA
 ****************************************************/

async function loadCameras() {

  const permission =
    await requestCameraPermission();


  if (!permission) {

    return;

  }


  try {

    const cameras =
      await Html5Qrcode.getCameras();


    cameraSelect.innerHTML = "";


    if (
      !cameras ||
      cameras.length === 0
    ) {

      setScannerStatus(
        "❌ Kamera tidak ditemukan."
      );

      return;

    }


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement("option");


        option.value =
          camera.id;


        option.textContent =
          camera.label ||
          "Kamera " +
          (index + 1);


        cameraSelect.appendChild(
          option
        );

      }
    );


    /*
     * Cari kamera belakang
     */

    let rearCamera =
      cameras.find(
        function(camera) {

          const label =
            (
              camera.label || ""
            ).toLowerCase();


          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("belakang")
          );

        }
      );


    if (rearCamera) {

      cameraSelect.value =
        rearCamera.id;

    }
    else {

      cameraSelect.value =
        cameras[0].id;

    }


    currentCameraId =
      cameraSelect.value;


    setScannerStatus(
      "✅ Kamera siap digunakan."
    );


  }

  catch (error) {

    console.error(error);

    setScannerStatus(
      "❌ Tidak dapat mengambil daftar kamera."
    );

  }

}


/****************************************************
 * GANTI KAMERA
 ****************************************************/

cameraSelect.addEventListener(
  "change",
  async function() {

    currentCameraId =
      cameraSelect.value;


    if (scannerRunning) {

      await stopScanner();

      await startScanner();

    }

  }
);


/****************************************************
 * MULAI SCANNER
 ****************************************************/

async function startScanner() {

  if (scannerRunning) {

    return;

  }


  if (!currentCameraId) {

    await loadCameras();

  }


  if (!currentCameraId) {

    alert(
      "Kamera belum tersedia."
    );

    return;

  }


  try {

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    await html5QrCode.start(

      currentCameraId,

      {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;


          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0,

        rememberLastUsedCamera: true

      },


      function(decodedText) {

        handleQrResult(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Error scan biasa diabaikan.
         */

      }

    );


    scannerRunning = true;


    setScannerStatus(
      "📷 Arahkan kamera ke QR siswa."
    );


  }

  catch (error) {

    console.error(error);

    scannerRunning = false;


    setScannerStatus(
      "❌ Kamera gagal dijalankan."
    );

  }

}


/****************************************************
 * HENTIKAN SCANNER
 ****************************************************/

async function stopScanner() {

  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

    html5QrCode.clear();

  }

  catch (error) {

    console.error(error);

  }


  scannerRunning = false;

  html5QrCode = null;


  setScannerStatus(
    "⛔ Kamera dihentikan."
  );

}


/****************************************************
 * QR TERBACA
 ****************************************************/

function handleQrResult(decodedText) {

  /*
   * Jika sedang memproses scan,
   * abaikan QR berikutnya.
   */

  if (processingScan) {

    return;

  }


  const id =
    String(
      decodedText || ""
    ).trim();


  if (!id) {

    return;

  }


  /*
   * Kunci agar kamera tidak
   * mengirim QR berkali-kali.
   */

  processingScan = true;


  prosesAbsensi(
    id
  );

}


/****************************************************
 * KIRIM KE APPS SCRIPT
 *
 * Menggunakan JSONP karena halaman
 * berada di GitHub Pages.
 ****************************************************/

function prosesAbsensi(id) {

  loading.style.display =
    "block";


  resultBox.style.display =
    "none";


  setScannerStatus(
    "⏳ Menghubungi server..."
  );


  const callbackName =
    "absensiCallback_" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  let selesai = false;


  /*
   * Fungsi callback
   */

  window[callbackName] =
    function(data) {

      selesai = true;


      try {

        tampilkanHasil(
          data
        );

      }

      finally {

        bersihkanRequest();

      }

    };


  /*
   * Timeout
   */

  const timeout =
    setTimeout(
      function() {

        if (!selesai) {

          selesai = true;


          tampilkanError(
            "Server tidak dapat dihubungi."
          );


          bersihkanRequest();

        }

      },
      15000
    );


  function bersihkanRequest() {

    clearTimeout(
      timeout
    );


    script.remove();


    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {}


    loading.style.display =
      "none";


    /*
     * Tunggu sebentar sebelum
     * menerima scan berikutnya.
     */

    setTimeout(
      function() {

        processingScan =
          false;


        if (scannerRunning) {

          setScannerStatus(
            "📷 Siap scan siswa berikutnya."
          );

        }

      },
      2500
    );

  }


  /*
   * Bangun URL API
   */

  const url =
    API_URL +
    "?action=scan" +
    "&id=" +
    encodeURIComponent(id) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.src =
    url;


  script.onerror =
    function() {

      if (!selesai) {

        selesai = true;


        tampilkanError(
          "Server tidak dapat dihubungi."
        );


        bersihkanRequest();

      }

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * TAMPILKAN HASIL
 ****************************************************/

function tampilkanHasil(data) {

  if (!data) {

    tampilkanError(
      "Respons server kosong."
    );

    return;

  }


  /*
   * ABSENSI BERHASIL
   */

  if (data.success === true) {

    resultBox.className =
      "success";


    resultBox.innerHTML = `

      <div class="result-icon">
        ✅
      </div>

      <div class="result-title">
        ABSENSI BERHASIL
      </div>

      <div class="student-name">
        ${escapeHtml(data.nama)}
      </div>

      <div class="student-info">

        ID: <b>${escapeHtml(data.id)}</b><br>

        Kelas: <b>${escapeHtml(data.kelas)}</b><br>

        Estate: <b>${escapeHtml(data.estate || "-")}</b><br>

        Tanggal: <b>${escapeHtml(data.tanggal)}</b><br>

        Jam: <b>${escapeHtml(data.jam)}</b>

      </div>

      <div class="status-hadir">
        HADIR
      </div>

    `;


    resultBox.style.display =
      "block";


    setScannerStatus(
      "✅ Absensi berhasil dicatat."
    );


    return;

  }


  /*
   * SUDAH ABSEN
   */

  if (data.already === true) {

    resultBox.className =
      "already";


    resultBox.innerHTML = `

      <div class="result-icon">
        ⚠️
      </div>

      <div class="result-title">
        SUDAH ABSEN
      </div>

      <div class="student-name">
        ${escapeHtml(data.nama)}
      </div>

      <div class="student-info">

        ID: <b>${escapeHtml(data.id)}</b><br>

        Kelas: <b>${escapeHtml(data.kelas)}</b><br>

        Tanggal: <b>${escapeHtml(data.tanggal)}</b><br>

        Absen pertama:
        <b>${escapeHtml(data.jam || "-")}</b>

      </div>

    `;


    resultBox.style.display =
      "block";


    setScannerStatus(
      "⚠️ Siswa sudah melakukan absensi hari ini."
    );


    return;

  }


  /*
   * ID TIDAK TERDAFTAR
   */

  if (data.invalid === true) {

    resultBox.className =
      "invalid";


    resultBox.innerHTML = `

      <div class="result-icon">
        ❌
      </div>

      <div class="result-title">
        ID TIDAK TERDAFTAR
      </div>

      <div class="student-name">
        ${escapeHtml(data.id || "-")}
      </div>

      <div class="student-info">
        QR ini tidak ditemukan
        dalam DATA_SISWA.
      </div>

    `;


    resultBox.style.display =
      "block";


    setScannerStatus(
      "❌ ID siswa tidak terdaftar."
    );


    return;

  }


  /*
   * ERROR SERVER
   */

  tampilkanError(
    data.message ||
    "Terjadi kesalahan."
  );

}


/****************************************************
 * ERROR
 ****************************************************/

function tampilkanError(message) {

  resultBox.className =
    "error";


  resultBox.innerHTML = `

    <div class="result-icon">
      ❌
    </div>

    <div class="result-title">
      TERJADI KESALAHAN
    </div>

    <div class="student-info">
      ${escapeHtml(message)}
    </div>

  `;


  resultBox.style.display =
    "block";


  setScannerStatus(
    "❌ Gagal memproses absensi."
  );

}


/****************************************************
 * KEAMANAN TEKS
 ****************************************************/

function escapeHtml(value) {

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/****************************************************
 * JALANKAN LOAD KAMERA
 ****************************************************/

loadCameras();

</script>

</body>
</html>
