<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<script src="auth.js"></script>
<title>
Dashboard Absensi - CLC Permodalan
</title>


<style>

*{
  box-sizing:border-box;
}


body{

  margin:0;

  font-family:
  Arial,
  Helvetica,
  sans-serif;

  background:
  #f4f6fa;

  color:#182238;

}


/* =========================
   HEADER
========================= */

.header{

  background:
  linear-gradient(
    135deg,
    #07152f,
    #102b5c
  );

  color:white;

  padding:28px 20px;

  box-shadow:
  0 5px 20px
  rgba(0,0,0,.12);

}


.header-inner{

  max-width:1200px;

  margin:auto;

}


.logo-title{

  font-size:14px;

  color:#d8b45a;

  font-weight:bold;

  letter-spacing:2px;

}


.title{

  font-size:30px;

  font-weight:800;

  margin-top:5px;

}


.subtitle{

  font-size:14px;

  opacity:.8;

  margin-top:6px;

}


/* =========================
   CONTAINER
========================= */

.container{

  max-width:1200px;

  margin:auto;

  padding:25px 18px 50px;

}


/* =========================
   FILTER
========================= */

.filter{

  background:white;

  border-radius:14px;

  padding:18px;

  box-shadow:
  0 4px 18px
  rgba(0,0,0,.06);

  display:flex;

  gap:15px;

  align-items:end;

  flex-wrap:wrap;

  margin-bottom:20px;

}


.filter-group{

  display:flex;

  flex-direction:column;

  gap:7px;

}


.filter-group label{

  font-size:12px;

  font-weight:bold;

  color:#697386;

}


select,
input{

  border:1px solid #d9deea;

  border-radius:9px;

  padding:11px 13px;

  font-size:14px;

  background:white;

  min-width:150px;

}


button{

  border:0;

  border-radius:9px;

  padding:12px 20px;

  background:#d3aa4c;

  color:#101b31;

  font-weight:bold;

  cursor:pointer;

}


button:hover{

  opacity:.9;

}


/* =========================
   CARDS
========================= */

.cards{

  display:grid;

  grid-template-columns:
  repeat(6,1fr);

  gap:12px;

  margin-bottom:22px;

}


.card{

  background:white;

  border-radius:14px;

  padding:18px;

  box-shadow:
  0 4px 18px
  rgba(0,0,0,.06);

}


.card-label{

  font-size:12px;

  color:#70798c;

  font-weight:bold;

}


.card-number{

  font-size:28px;

  font-weight:800;

  margin-top:7px;

}


.card-percent{

  color:#15803d;

}


/* =========================
   SECTION
========================= */

.section{

  background:white;

  border-radius:14px;

  box-shadow:
  0 4px 18px
  rgba(0,0,0,.06);

  margin-bottom:20px;

  overflow:hidden;

}


.section-title{

  padding:17px 20px;

  font-weight:800;

  font-size:16px;

  border-bottom:
  1px solid #edf0f5;

}


/* =========================
   CLASS TABLE
========================= */

.table-wrap{

  overflow-x:auto;

}


table{

  width:100%;

  border-collapse:collapse;

  font-size:13px;

}


th{

  background:#f7f8fb;

  color:#697386;

  font-size:11px;

  text-transform:uppercase;

}


th,
td{

  padding:12px;

  border-bottom:
  1px solid #edf0f5;

  text-align:center;

}


td:nth-child(1),
td:nth-child(2){

  text-align:left;

}


.progress{

  height:7px;

  background:#edf0f5;

  border-radius:20px;

  overflow:hidden;

  min-width:80px;

}


.progress-bar{

  height:100%;

  background:#d3aa4c;

}


/* =========================
   STATUS
========================= */

.badge{

  display:inline-block;

  padding:5px 9px;

  border-radius:20px;

  font-size:11px;

  font-weight:bold;

}


.hadir{

  background:#dcfce7;

  color:#15803d;

}


.sakit{

  background:#fef3c7;

  color:#a16207;

}


.izin{

  background:#dbeafe;

  color:#1d4ed8;

}


.alpa{

  background:#fee2e2;

  color:#b91c1c;

}


.belum{

  background:#e5e7eb;

  color:#4b5563;

}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:40px;

  color:#6b7280;

}


.empty{

  text-align:center;

  padding:30px;

  color:#9ca3af;

}


/* =========================
   PRINT
========================= */

@media print{

  body{

    background:white;

  }

  .filter,
  button{

    display:none !important;

  }

  .header{

    box-shadow:none;

  }

  .section,
  .card{

    box-shadow:none;

    border:
    1px solid #ddd;

  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .cards{

    grid-template-columns:
    repeat(3,1fr);

  }

}


@media(max-width:600px){

  .header{

    padding:22px 16px;

  }


  .title{

    font-size:23px;

  }


  .container{

    padding:
    16px 12px 40px;

  }


  .filter{

    display:grid;

    grid-template-columns:
    1fr 1fr;

  }


  .filter-group{

    width:100%;

  }


  select,
  input{

    width:100%;

    min-width:0;

  }


  .filter button{

    width:100%;

    grid-column:
    span 2;

  }


  .cards{

    grid-template-columns:
    repeat(2,1fr);

    gap:10px;

  }


  .card{

    padding:15px;

  }


  .card-number{

    font-size:24px;

  }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

  <div class="header-inner">

    <div class="logo-title">
      CLC PERMODALAN
    </div>

    <div class="title">
      DASHBOARD ABSENSI
    </div>

    <div class="subtitle"
    id="tanggalHeader">
      Memuat data...
    </div>

  </div>

</div>


<div class="container">


<!-- FILTER -->

<div class="filter">


  <div class="filter-group">

    <label>
      TANGGAL
    </label>

    <input
      type="date"
      id="tanggal">

  </div>


  <div class="filter-group">

    <label>
      KELAS
    </label>

    <select id="kelas">

      <option value="SEMUA">
        Semua Kelas
      </option>

      <option value="7">
        Kelas 7
      </option>

      <option value="8">
        Kelas 8
      </option>

      <option value="9">
        Kelas 9
      </option>

    </select>

  </div>


  <button
  onclick="loadDashboard()">

    Tampilkan

  </button>


  <button
  onclick="window.print()">

    Cetak

  </button>


</div>


<!-- CARDS -->

<div class="cards">


  <div class="card">

    <div class="card-label">
      TOTAL SISWA
    </div>

    <div
    class="card-number"
    id="total">
      -
    </div>

  </div>


  <div class="card">

    <div class="card-label">
      HADIR
    </div>

    <div
    class="card-number"
    id="hadir">
      -
    </div>

  </div>


  <div class="card">

    <div class="card-label">
      SAKIT
    </div>

    <div
    class="card-number"
    id="sakit">
      -
    </div>

  </div>


  <div class="card">

    <div class="card-label">
      IZIN
    </div>

    <div
    class="card-number"
    id="izin">
      -
    </div>

  </div>


  <div class="card">

    <div class="card-label">
      ALPA
    </div>

    <div
    class="card-number"
    id="alpa">
      -
    </div>

  </div>


  <div class="card">

    <div class="card-label">
      BELUM ABSEN
    </div>

    <div
    class="card-number"
    id="belum">
      -
    </div>

  </div>


</div>


<!-- PERCENTAGE -->

<div class="section">

  <div class="section-title">
    PERSENTASE KEHADIRAN
  </div>

  <div style="padding:20px">

    <div style="
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-weight:bold;
    ">

      <span>
        Kehadiran
      </span>

      <span id="persen">
        0%
      </span>

    </div>


    <div class="progress"
    style="height:12px">

      <div
      class="progress-bar"
      id="persenBar"
      style="width:0%">
      </div>

    </div>

  </div>

</div>


<!-- KELAS -->

<div class="section">

  <div class="section-title">
    RINGKASAN PER KELAS
  </div>

  <div
  class="table-wrap"
  id="kelasContainer">

    <div class="loading">
      Memuat data...
    </div>

  </div>

</div>


<!-- SISWA -->

<div class="section">

  <div class="section-title">
    STATUS SISWA
  </div>

  <div
  class="table-wrap"
  id="siswaContainer">

    <div class="loading">
      Memuat data...
    </div>

  </div>

</div>


</div>


<script>


/* =========================
   KONFIGURASI
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwBGvZdnWIfwNjpevh9WLSPtfD5ho_TqOYm9z2xFwE5SdKP_egi1INIkRevY3yFLNxi/exec";


/* =========================
   TANGGAL HARI INI
========================= */

function tanggalHariIni(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1)
    .padStart(2,"0");

  const day =
    String(d.getDate())
    .padStart(2,"0");

  return y + "-" + m + "-" + day;

}


document.getElementById(
  "tanggal"
).value = tanggalHariIni();


/* =========================
   JSONP
========================= */

function jsonp(url){

  return new Promise(
    function(resolve,reject){

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random()*10000
        );

      const script =
        document.createElement("script");

      window[callbackName] =
        function(data){

          resolve(data);

          delete window[callbackName];

          script.remove();

        };


      script.onerror =
        function(){

          reject(
            new Error(
              "Gagal menghubungi server."
            )
          );

          delete window[callbackName];

          script.remove();

        };


      script.src =
        url +
        "&callback=" +
        callbackName;

      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard(){

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;

  const kelas =
    document.getElementById(
      "kelas"
    ).value;


  document.getElementById(
    "kelasContainer"
  ).innerHTML =
  '<div class="loading">Memuat data...</div>';


  document.getElementById(
    "siswaContainer"
  ).innerHTML =
  '<div class="loading">Memuat data...</div>';


  try{

    const url =
      API_URL +
      "?action=dashboard" +
      "&tanggal=" +
      encodeURIComponent(tanggal) +
      "&kelas=" +
      encodeURIComponent(kelas);


    const data =
      await jsonp(url);


    if(!data.success){

      throw new Error(
        data.message ||
        "Gagal memuat dashboard."
      );

    }


    tampilkanDashboard(data);

  }

  catch(error){

    console.error(error);

    document.getElementById(
      "kelasContainer"
    ).innerHTML =
    '<div class="empty">' +
    'Gagal memuat data.' +
    '</div>';


    document.getElementById(
      "siswaContainer"
    ).innerHTML =
    '<div class="empty">' +
    'Silakan coba lagi.' +
    '</div>';

  }

}


/* =========================
   TAMPILKAN DASHBOARD
========================= */

function tampilkanDashboard(data){


  document.getElementById(
    "tanggalHeader"
  ).textContent =
    data.tanggalTampil;


  document.getElementById(
    "total"
  ).textContent =
    data.total;


  document.getElementById(
    "hadir"
  ).textContent =
    data.hadir;


  document.getElementById(
    "sakit"
  ).textContent =
    data.sakit;


  document.getElementById(
    "izin"
  ).textContent =
    data.izin;


  document.getElementById(
    "alpa"
  ).textContent =
    data.alpa;


  document.getElementById(
    "belum"
  ).textContent =
    data.belum;


  document.getElementById(
    "persen"
  ).textContent =
    data.persentase + "%";


  document.getElementById(
    "persenBar"
  ).style.width =
    data.persentase + "%";


  tampilkanKelas(
    data.kelas
  );


  tampilkanSiswa(
    data.siswa
  );

}


/* =========================
   TABEL KELAS
========================= */

function tampilkanKelas(data){

  if(!data || data.length === 0){

    document.getElementById(
      "kelasContainer"
    ).innerHTML =
    '<div class="empty">' +
    'Tidak ada data kelas.' +
    '</div>';

    return;

  }


  let html = `
  <table>

    <thead>

      <tr>

        <th>Kelas</th>

        <th>Total</th>

        <th>Hadir</th>

        <th>Sakit</th>

        <th>Izin</th>

        <th>Alpa</th>

        <th>Belum</th>

        <th>Kehadiran</th>

      </tr>

    </thead>

    <tbody>
  `;


  data.forEach(function(k){

    html += `

      <tr>

        <td>
          <strong>
            ${escapeHtml(k.kelas)}
          </strong>
        </td>

        <td>
          ${k.total}
        </td>

        <td>
          <span class="badge hadir">
            ${k.hadir}
          </span>
        </td>

        <td>
          <span class="badge sakit">
            ${k.sakit}
          </span>
        </td>

        <td>
          <span class="badge izin">
            ${k.izin}
          </span>
        </td>

        <td>
          <span class="badge alpa">
            ${k.alpa}
          </span>
        </td>

        <td>
          <span class="badge belum">
            ${k.belum}
          </span>
        </td>

        <td>

          <div style="
          display:flex;
          align-items:center;
          gap:8px;
          ">

            <div class="progress">

              <div
              class="progress-bar"
              style="
              width:${k.persen}%
              ">
              </div>

            </div>

            <strong>
              ${k.persen}%
            </strong>

          </div>

        </td>

      </tr>

    `;

  });


  html += `
    </tbody>
  </table>
  `;


  document.getElementById(
    "kelasContainer"
  ).innerHTML = html;

}


/* =========================
   TABEL SISWA
========================= */

function tampilkanSiswa(data){

  if(!data || data.length === 0){

    document.getElementById(
      "siswaContainer"
    ).innerHTML =
    '<div class="empty">' +
    'Tidak ada siswa.' +
    '</div>';

    return;

  }


  let html = `

  <table>

    <thead>

      <tr>

        <th>No</th>

        <th>Nama</th>

        <th>ID</th>

        <th>Kelas</th>

        <th>Status</th>

        <th>Jam</th>

      </tr>

    </thead>

    <tbody>

  `;


  data.forEach(function(s,index){

    let cls =
      "belum";

    if(s.status === "HADIR")
      cls = "hadir";

    else if(s.status === "SAKIT")
      cls = "sakit";

    else if(s.status === "IZIN")
      cls = "izin";

    else if(s.status === "ALPA")
      cls = "alpa";


    html += `

      <tr>

        <td>
          ${index + 1}
        </td>

        <td>
          <strong>
            ${escapeHtml(s.nama)}
          </strong>
        </td>

        <td>
          ${escapeHtml(s.id)}
        </td>

        <td>
          ${escapeHtml(s.kelas)}
        </td>

        <td>

          <span class="badge ${cls}">
            ${escapeHtml(s.status)}
          </span>

        </td>

        <td>
          ${escapeHtml(s.jam || "-")}
        </td>

      </tr>

    `;

  });


  html += `
    </tbody>
  </table>
  `;


  document.getElementById(
    "siswaContainer"
  ).innerHTML = html;

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD PERTAMA
========================= */

loadDashboard();

</script>


</body>

</html>
